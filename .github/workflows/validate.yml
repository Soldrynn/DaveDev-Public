name: Resource validation

on:
  pull_request:
  push:
    branches: [main, 'maintenance/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: FiveM static validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build pinned CfxLua tools
        run: bash scripts/build-cfxlua.sh "$RUNNER_TEMP/cfxlua"
      - name: Test the validator
        env:
          CFXLUA: ${{ runner.temp }}/cfxlua/lua
          CFXLUAC: ${{ runner.temp }}/cfxlua/luac
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate resources
        env:
          CFXLUA: ${{ runner.temp }}/cfxlua/lua
          CFXLUAC: ${{ runner.temp }}/cfxlua/luac
        run: python3 scripts/validate.py
